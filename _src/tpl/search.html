{% extends 'base.html' %}
{% from 'macros.html' import ico, prod with context %}
{% block top %}
  <div class="top top--plain">
{% include 'header.html' %}
  </div>
{% endblock %}
{% block content %}
  <!-- ============ РЕЗУЛЬТАТЫ ПОИСКА ============ -->
  <section class="section results">
    <h1 class="results__title">Результаты поиска</h1>
    <form class="search__form" action="search.html" method="get" role="search">
      <label class="search__field">
        {{ ico('search') }}
        <span class="visually-hidden">Что ищем</span>
        <input type="search" name="q" value="Контейнер морской" placeholder="Тип, модель или категория контейнера">
      </label>
      <button class="btn search__submit" type="submit">Найти</button>
    </form>
    <p class="results__count">Найдено: 120 результатов</p>
    <div class="results__body">
      <ul class="prod-list">
        {%- for p in catalog %}{{ prod(p) }}{% endfor %}
      </ul>
      <button class="btn-more" type="button">Показать ещё 82 товара</button>
    </div>
  </section>
{% endblock %}
